title: MSHTA Loading Remote Content
id: 817c3d45-5e16-4ab9-a3ef-84b15171c957
status: test
description: MSHTA starts with an HTTP or HTTPS resource, a pattern associated with proxy execution of remote script content.
references:
  - https://attack.mitre.org/techniques/T1218/005/
author: Angelo Pitarresi
date: 2026-09-08
tags:
  - attack.defense-evasion
  - attack.t1218.005
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    Image|endswith: '\mshta.exe'
  selection_remote:
    CommandLine|contains:
      - 'http://'
      - 'https://'
  condition: selection_image and selection_remote
falsepositives:
  - Legacy applications that intentionally launch remote HTA content
level: high
