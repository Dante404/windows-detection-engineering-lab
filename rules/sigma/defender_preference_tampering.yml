title: Defender Preference Tampering Through PowerShell
id: 57dc8f2e-c8ac-4b10-9fd7-12c456f2e0a6
status: test
description: PowerShell changes Microsoft Defender Antivirus protection or exclusion preferences using a high-risk setting.
references:
  - https://learn.microsoft.com/en-us/powershell/module/defender/set-mppreference
  - https://learn.microsoft.com/en-us/powershell/module/defender/add-mppreference
  - https://attack.mitre.org/techniques/T1562/001/
author: Angelo Pitarresi
date: 2026-09-08
tags:
  - attack.defense-evasion
  - attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_cmdlet:
    CommandLine|contains:
      - Set-MpPreference
      - Add-MpPreference
  selection_setting:
    CommandLine|contains:
      - DisableRealtimeMonitoring
      - DisableBehaviorMonitoring
      - DisableIOAVProtection
      - ExclusionPath
      - ExclusionProcess
      - ExclusionExtension
  condition: selection_image and selection_cmdlet and selection_setting
falsepositives:
  - Authorized endpoint-security configuration or temporary troubleshooting
level: high
